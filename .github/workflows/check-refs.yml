name: check references

on:
  push:
  pull_request:
  # The release workflow runs these before it publishes.
  workflow_call:

jobs:
  check-refs:
    # The hooks are POSIX sh and run on users' Macs as well as Linux.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_refs.py
      - run: python3 _fixtures/write_cases.py --check
        working-directory: plumb/evals
      - run: python3 scripts/build_codex.py --check
      - run: python3 scripts/test_check_commit.py
      - run: python3 scripts/test_session_start.py
      - run: python3 scripts/test_charter_gate.py
      - run: python3 scripts/test_after_push.py
      - run: python3 scripts/test_release.py
      - run: python3 scripts/test_graders.py

  # A pull request that releases says what changes for users, or the release notes fall back to commit subjects.
  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release:none')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # A leading Jira key ("[PROJ-123] fix: ...") doesn't change what the title releases.
          case "$TITLE" in \[[A-Z]*-[0-9]*\]\ *) TITLE=${TITLE#*\] } ;; esac
          case "$TITLE" in
            feat*|fix*|perf*|*'!:'*) ;;
            *) exit 0 ;;
          esac
          if ! awk '/^## Unreleased/ { inside = 1; next } /^## / { inside = 0 } inside && /^- / { n++ } END { exit n ? 0 : 1 }' plumb/CHANGELOG.md; then
            echo "This pull request releases ($TITLE): add what changes for users under '## Unreleased' in plumb/CHANGELOG.md."
            exit 1
          fi
