name: check references

on:
  push:
  pull_request:

jobs:
  check-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_refs.py
      - run: python3 scripts/build_codex.py --check
      - run: python3 scripts/test_check_commit.py
      - run: python3 scripts/test_release.py
